<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="grid">
        <div class="col-12">
            <div class="card">
                <div style="display: flex; justify-content: center; align-items: center; flex-direction: column;">
                    <p-image src="https://firmaenlinea.ec/assets/img/clients/client-7.png" alt="Image" width="250"></p-image>
                </div>
                <h5>1. Ingrese la cédula de la persona a firmar</h5>
                <br>
                <span class="p-float-label">
                    <input id="cedula" type="text" [(ngModel)]="cedula" pInputText>
                    <label for="cedula">Cédula</label>
                </span>
                <h5>2. Cargue los documentos a ser firmados</h5>
                <p-fileUpload name="demo[]" url="https://www.primefaces.org/cdn/api/upload.php" uploadLabel="Firmar" (onUpload)="onUpload($event)"
                              [multiple]="true" accept=".pdf" [maxFileSize]="5250000">
                    <ng-template pTemplate="content">
                        <ul *ngIf="uploadedFiles.length">
                            <li *ngFor="let file of uploadedFiles">{{file.name}} - {{file.size}} bytes</li>
                        </ul>
                    </ng-template>
                </p-fileUpload>
                <h5>3. Descargue los documentos firmados</h5>
                <p-button class="p-button-success" label="Descargar Documento" [disabled]="!botonHabilitado" (onClick)="descargar()"></p-button>
            </div>
        </div>
    </div>
</body>
</html>
